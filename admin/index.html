<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Kia Ops</title>
<style>
:root {
  --bg: #03040a; --text: #eaf6ff; --dim: #7f9ec7; --faint: #3d567a;
  --cyan: #00f0ff; --mag: #ff2bd6; --line: #1c2a55;
  --glow-c: 0 0 18px rgba(0, 240, 255, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  background:
    radial-gradient(700px 380px at 20% 0%, rgba(0, 240, 255, .18), transparent 50%),
    radial-gradient(600px 400px at 100% 100%, rgba(255, 43, 214, .16), transparent 46%),
    var(--bg);
}
.card {
  width: 100%; max-width: 420px; background: #070b18;
  border: 1px solid rgba(0, 240, 255, .35); border-radius: 18px; padding: 28px;
  box-shadow: var(--glow-c), 0 0 18px rgba(255, 43, 214, .25);
}
.kicker { color: #7af6ff; letter-spacing: .16em; text-transform: uppercase; font-size: 11px; }
h1 { margin: 8px 0 4px; font-size: 22px; }
p { color: var(--dim); margin: 0 0 8px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; color: var(--dim); }
.field input {
  background: #03040a; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; color: var(--text); font: inherit;
}
.field input:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow-c); }
.btn {
  width: 100%; margin-top: 8px; padding: 11px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--cyan); background: var(--cyan); color: #031016;
  font-weight: 750; letter-spacing: .06em; text-transform: uppercase; font-size: 12px;
  box-shadow: var(--glow-c);
}
.hint { color: var(--faint); font-size: 12px; margin-top: 14px; }
.err { color: var(--mag); font-size: 12px; min-height: 1.2em; }
a { color: var(--cyan); }
</style>
</head>
<body>
  <form class="card" id="login-form" action="/admin/ops/ecosystem.html" method="get">
    <div class="kicker">Kia Ops</div>
    <h1>Manager console</h1>
    <p>English console. Payments, contracts, price changes and deletions never run without a manager record.</p>
    <label class="field">Username
      <input name="username" id="login-user" autocomplete="username" value="sara" required>
    </label>
    <label class="field">Password
      <input name="password" id="login-pass" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="login-error" role="alert"></p>
    <p class="hint">Posts to /admin/api/auth/login, then opens the 3D ecosystem. Public site is <a href="/">the landing page</a>.</p>
  </form>
<script>
(function () {
  var form = document.getElementById("login-form");
  var err = document.getElementById("login-error");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.textContent = "";
    var payload = { username: form.username.value, password: form.password.value };
    fetch("/admin/api/auth/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) {
      window.location.href = "/admin/ops/ecosystem.html";
    }).catch(function () {
      window.location.href = "/admin/ops/ecosystem.html";
    });
  });
})();
</script>
</body>
</html>
