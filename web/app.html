<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zenovix · Customer app</title>
<link rel="icon" href="/web/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0E0A1E;--panel:#16112A;--panel-2:#1c1540;--line:#2a2350;--ink:#F1ECFB;--dim:#A79FBE;--faint:#6E6879;--cyan:#B79BF2;--gold:#C7A9F5;--teal:#3B8DF5;--nav:72px}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
#app{min-height:100svh;display:flex;flex-direction:column;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);z-index:3}
header .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
header .live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.blink{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
main{flex:1;padding:14px 14px 20px;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.ph{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.ph::before{content:"// ";color:var(--faint)}
.hint{font-size:10.5px;color:var(--faint)}
.panel-body{padding:10px 12px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;width:100%;
  color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center}
.card:active{border-color:var(--cyan)}
.card .sev{background:var(--cyan);border-radius:2px;height:100%;min-height:36px;box-shadow:0 0 8px var(--cyan)}
.card h2{margin:0 0 3px;font-size:14px}
.card p{margin:0;color:var(--dim);font-size:12px}
.card .arrow{color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--dim);cursor:pointer;font:inherit}
.chip.on{color:var(--bg);background:var(--cyan);border-color:var(--cyan)}
.prod{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.prod:last-child{border-bottom:0}
.prod img,.prod .ph-img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);display:block}
.prod .code{color:var(--gold);font-size:11px;letter-spacing:.08em}
.prod .name{font-weight:700;font-size:13px}
.prod .title{color:var(--dim);font-size:11px}
.prod .price{color:var(--teal);font-size:12px;text-align:right;white-space:nowrap}
.prod .order{display:block;margin-top:6px;border:1px solid var(--line);background:transparent;color:var(--cyan);border-radius:8px;padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
.metrics{display:flex;gap:18px;flex-wrap:wrap;padding:4px 0 12px}
.metric .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-size:20px;font-weight:700}
.empty{color:var(--faint);text-align:center;padding:16px 0;font-size:12px}
.note{color:var(--dim);font-size:12px;margin:0 0 12px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a,nav.bottom button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;cursor:pointer}
nav.bottom .on{color:var(--cyan)}
svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);padding:10px 16px;border-radius:12px;display:none;font-size:12px;max-width:92vw}
html[dir="rtl"] .card,html[dir="rtl"] .prod{direction:rtl;text-align:right}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="#16112A"/><rect x="7" y="7" width="8" height="8" rx="2" fill="#8A3FE6"/><rect x="17" y="7" width="8" height="8" rx="2" fill="#5B6BF0"/><rect x="12" y="17" width="8" height="8" rx="2" fill="#3B8DF5"/></svg>
    <div><div class="label">Zenovix</div><strong>Customer app</strong></div>
    <div class="live"><span class="blink"></span><span id="conn">online</span></div>
  </header>
  <main id="view">
    <p class="note">Ask about our services, open support, or request a proposal. Scope and price are confirmed by a manager. This app never shows admin tools.</p>
    <section class="panel" id="catalog-panel">
      <div class="panel-head"><span class="ph" id="cat-title">Products &amp; services</span><span class="hint" id="cat-hint">loading…</span></div>
      <div class="panel-body">
        <div class="chips" id="cat-chips"></div>
        <div id="cat-list"><div class="empty">Loading the catalog…</div></div>
      </div>
    </section>
    <button class="card" type="button" data-action="products"><span class="sev"></span><span><h2>Services</h2><p>Open the services menu in the bot — pick a service and tell us about your project.</p></span><span class="arrow">›</span></button>
    <button class="card" type="button" data-action="support"><span class="sev" style="background:var(--gold);box-shadow:0 0 8px var(--gold)"></span><span><h2>Support</h2><p>Open a ticket from Telegram. Safety cases go to a person at once.</p></span><span class="arrow">›</span></button>
    <button class="card" type="button" data-action="quote"><span class="sev" style="background:var(--teal);box-shadow:0 0 8px var(--teal)"></span><span><h2>Quote</h2><p>Your request goes to a manager. You are told the moment it is approved.</p></span><span class="arrow">›</span></button>
  </main>
  <nav class="bottom" aria-label="App">
    <a class="on" href="/app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10l8-6 8 6v10H4z"/></svg>Home</a>
    <button type="button" data-action="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Products</button>
    <button type="button" data-action="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/></svg>Support</button>
    <button type="button" data-action="quote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16l5-5 4 3 7-8"/></svg>Quote</button>
  </nav>
</div>
<div class="toast" id="notice" role="status"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/web/js/public.js"></script>
</body>
</html>
