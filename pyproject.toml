[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Kia-Agent-platform"
version = "20.0.0"
description = "International AI operations platform â€” v20 QA + automation"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Kia-Agent Team"},
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "aiobotocore>=2.12.0",
    "aiogram>=3.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]
production = [
    "gunicorn>=22.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B008", "TC001", "TC002", "TC003", "E402", "E741", "F841", "SIM105", "SIM102", "SIM103", "SIM108", "SIM110", "SIM115", "SIM117", "SIM201", "SIM222", "B904", "B905", "B007", "B017", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["boto3.*", "aiobotocore.*", "botocore.*", "aiogram.*", "argon2.*", "pydantic.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/storage/lua/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B608"]
