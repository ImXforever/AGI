<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ارزش فعلی پروژه</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      background: #0f1419;
      color: #f4f1ea;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #1a222c;
      border: 1px solid #2c3846;
      border-radius: 20px;
      padding: 40px 32px 32px;
      text-align: center;
    }
    .label {
      color: #9aa8b5;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .price {
      font-size: clamp(48px, 12vw, 72px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #e8c07a;
      line-height: 1;
    }
    .range {
      margin-top: 10px;
      color: #c9d3dc;
      font-size: 18px;
    }
    .note {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #2c3846;
      color: #9aa8b5;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <article class="card">
    <p class="label">ارزش فعلی همین کد — همین الان</p>
    <p class="price">$15,000</p>
    <p class="range">بازه منصفانه: $12,000 — $18,000</p>
    <p class="note">
      اسکلت قوی است، محصول آمادهٔ شرکت نیست.<br>
      اگر کامل و وصل به ابزار واقعی شرکت شود: حدود $60,000.
    </p>
  </article>
</body>
</html>
